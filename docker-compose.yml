services:
  db:
    image: mysql:8.0
    container_name: ktor_db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ktor_phpmyadmin
    restart: always

    depends_on:
      db:
        condition: service_healthy

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${PHPMYADMIN_PORT}:80"


  app:
    build: .
    container_name: ktor_app
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

    environment:
      PORT: ${APP_PORT}

      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${APP_PORT}:8080"


volumes:
  db_data:
