ktor:
  application:
    modules:
      - com.example.ApplicationKt.module
  deployment:
    port: ${APP_PORT}

jwt:
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  realm: ${JWT_REALM}
  secret: ${JWT_SECRET}

database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  pass: ${DB_PASS}
