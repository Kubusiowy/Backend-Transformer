<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bezpieczne logowanie do panelu Energeon. Nowoczesny panel do zarzadzania transformatorami i danymi technicznymi.">
    <meta name="keywords" content="energeon, panel, transformatory, zarzadzanie, logowanie, energia">
    <meta name="author" content="Energeon">
    <meta name="application-name" content="Energeon">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1f2937">
    <meta name="color-scheme" content="light dark">
    <meta property="og:title" content="Energeon - Logowanie">
    <meta property="og:description" content="Bezpieczne logowanie do panelu Energeon. Zarzadzaj danymi transformatorow w jednym miejscu.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pl_PL">
    <meta property="og:site_name" content="Energeon">
    <meta name="twitter:card" content="summary">
    <title>Logowanie - Energeon</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light auth-page">
    <header class="auth-topbar"><a class="topbar__brand" href="/"><span>Energeon</span></a><button class="btn btn-outline-secondary btn-sm" id="themeToggle" type="button" aria-pressed="false">Ciemny motyw</button></header>

    <a class="skip-link" href="#main">Przejdź do treści</a>
    <main id="main" class="page page--auth">
        <section class="card auth-form-card">
            <div class="card__header">
                <h1 id="formTitle">Zaloguj się</h1>
                <p id="formSubtitle"></p>
            </div>

            <div class="switch" role="group" aria-label="Tryb formularza" id="modeSwitch">
                <button class="switch__btn" type="button" data-mode="login" aria-pressed="true">Logowanie</button>
                <button class="switch__btn" type="button" data-mode="register" aria-pressed="false">Załóż konto</button>
                <span class="switch__pill" aria-hidden="true"></span>
            </div>

            <form id="authForm" class="form" novalidate>
                <label class="field">
                    <span>E-mail</span>
                    <input class="form-control" type="email" name="email" placeholder="użytkownik@firma.pl" autocomplete="email" required>
                </label>

                <label class="field">
                    <span>Hasło</span>
                    <input class="form-control" type="password" name="password" placeholder="Wpisz hasło" minlength="8" autocomplete="current-password" required>
                </label>

                <label class="field field--optional" id="repeatField">
                    <span>Powtórz hasło</span>
                    <input class="form-control" type="password" name="passwordRepeat" placeholder="Powtórz hasło" minlength="8">
                </label>

                <label class="check" id="rememberRow">
                    <input type="checkbox" name="remember" id="rememberMe">
                    <span>Zapamiętaj mnie</span>
                </label>

                <button type="submit" class="btn btn-primary" id="submitBtn">Zaloguj się</button>
            </form>

            <div class="result" role="status" aria-live="polite" id="result" hidden>
                <div class="result__title">Status</div>
                <div class="result__body" id="resultBody"></div>
            </div>
        </section>
    </main>

    <button class="a11y-fab" id="a11yToggle" type="button" aria-expanded="false" aria-controls="a11yPanel">Dostępność</button>
    <aside class="a11y-panel" id="a11yPanel" role="dialog" aria-label="Ustawienia dostępności">
        <div class="a11y-panel__header">
            <div class="a11y-panel__title">Tekst i kontrast</div>
            <button class="a11y-close" id="a11yClose" type="button" aria-label="Zamknij panel">Zamknij</button>
        </div>
        <div class="a11y-option">
            <span>Rozmiar tekstu</span>
            <div class="a11y-buttons">
                <button class="a11y-chip" type="button" data-a11y-text="0" aria-pressed="true">Standard</button>
                <button class="a11y-chip" type="button" data-a11y-text="1" aria-pressed="false">Duży</button>
                <button class="a11y-chip" type="button" data-a11y-text="2" aria-pressed="false">Bardzo duży</button>
            </div>
        </div>
        <div class="a11y-option">
            <button class="a11y-toggle" type="button" data-a11y-toggle="contrast" aria-pressed="false">Wysoki kontrast</button>
            <button class="a11y-toggle" type="button" data-a11y-toggle="reduceMotion" aria-pressed="false">Zredukuj animacje</button>
            <button class="a11y-toggle" type="button" data-a11y-toggle="underline" aria-pressed="false">Podkreśl linki</button>
        </div>
    </aside>

    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script src="ui.js"></script>
    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
